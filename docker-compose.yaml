services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-autogestor}
      POSTGRES_USER: ${DB_USER:-autogestor}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-autogestor}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    develop:
      watch:
        - action: sync
          path: ./api
          target: /app
        - action: rebuild
          path: ./api/requirements.txt
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-True}
      DATABASE_URL: postgresql://${DB_USER:-autogestor}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-autogestor}
      DB_NAME: ${DB_NAME:-autogestor}
      DB_USER: ${DB_USER:-autogestor}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,api}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:3000/recuperar-senha}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@autogestor.local}
    volumes:
      - api_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  front:
    build:
      context: ./front
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:80"

volumes:
  pgdata:
  api_media:
