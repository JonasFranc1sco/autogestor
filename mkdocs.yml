site_name: Autogestor Documentation
site_description: Documentação técnica do sistema Autogestor
site_author: Vitor & Jonas
use_directory_urls: false

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Arquitetura: arquitetura.md
  - Backend:
      - Visão Geral: backend/index.md
      - Modelos: backend/models.md
      - API: backend/api.md
      - Autenticação: backend/autenticacao.md
      - Configuração: backend/configuracao.md
  - Frontend:
      - Visão Geral: frontend/index.md
      - Páginas: frontend/paginas.md
      - Componentes: frontend/componentes.md
      - Serviços: frontend/servicos.md
      - Configuração: frontend/configuracao.md
  - Deploy:
      - Docker: deploy/docker.md
      - VPS: deploy/vps.md
  - Guia:
      - Início Rápido: guia/inicio-rapido.md
      - Variáveis de Ambiente: guia/variaveis-ambiente.md
